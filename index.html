<div id="kandidatky-app-2026">
    <h2>Kandidátky pro volby do zastupitelstev obcí 2026</h2>

    <div class="tabs">
        <div class="tab" id="tab-obce">Kandidáti v obcích</div>
        <div class="tab inactive" id="tab-hledat">Hledat kandidáta</div>
    </div>

    <!-- Pohled pro obce -->
    <div id="obce-view">
        <div class="form-group">
            <label for="kraj">Kraj</label>
            <select id="kraj">
                <option value="">Vyberte kraj</option>
            </select>
        </div>
        <div class="form-group">
            <label for="okres">Okres</label>
            <select id="okres" disabled>
                <option value="">Vyberte okres</option>
            </select>
        </div>
        <div class="form-group">
            <label for="obec">Obec nebo městská část</label>
            <select id="obec" disabled>
                <option value="">Vyberte obec</option>
            </select>
        </div>
        <div id="loading-obce" style="display:none; color:#0033cc; font-weight:bold; margin:20px 0;">Načítám data...</div>
        <div id="vysledky-obce"></div>
    </div>

    <!-- Pohled pro vyhledávání -->
    <div id="search-view">
        <div class="search-input-container">
            <input type="text" id="search-input" placeholder="Vyhledat jméno kandidáta" disabled>
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
        <div id="loading-search" style="display:none; color:#0033cc; font-weight:bold; margin:20px 0;">Stahuji databázi kandidátů...</div>
        <div id="vysledky-search">Začněte psát pro vyhledávání.</div>
    </div>
</div>

<script>
    (function() {
        let lokalityData = {};
        let searchIndex = [];
        let searchIndexLoaded = false;

        const selKraj = document.getElementById('kraj');
        const selOkres = document.getElementById('okres');
        const selObec = document.getElementById('obec');
        const vysledkyObceDiv = document.getElementById('vysledky-obce');
        const loadingObceDiv = document.getElementById('loading-obce');

        const tabObce = document.getElementById('tab-obce');
        const tabHledat = document.getElementById('tab-hledat');
        const obceView = document.getElementById('obce-view');
        const searchView = document.getElementById('search-view');
        
        const searchInput = document.getElementById('search-input');
        const vysledkySearchDiv = document.getElementById('vysledky-search');
        const loadingSearchDiv = document.getElementById('loading-search');

        // Přepínání záložek
        tabObce.addEventListener('click', () => {
            tabObce.classList.remove('inactive');
            tabHledat.classList.add('inactive');
            obceView.style.display = 'block';
            searchView.style.display = 'none';
        });

        tabHledat.addEventListener('click', () => {
            tabHledat.classList.remove('inactive');
            tabObce.classList.add('inactive');
            obceView.style.display = 'none';
            searchView.style.display = 'block';
            
            if (!searchIndexLoaded) {
                loadSearchIndex();
            }
        });

        // 1. Načtení navigačního stromu (RAW z GitHubu)
        fetch('https://raw.githubusercontent.com/bi-cnc/kandidatky-2026/main/lokality.json')
            .then(res => res.json())
            .then(data => {
                lokalityData = data;
                Object.keys(data).sort().forEach(kraj => {
                    let opt = document.createElement('option');
                    opt.value = kraj;
                    opt.textContent = kraj;
                    selKraj.appendChild(opt);
                });
            })
            .catch(err => console.error("Chyba při načítání lokalit: ", err));

        // 2. Obsluha výběru kraje
        selKraj.addEventListener('change', function() {
            const kraj = this.value;
            selOkres.innerHTML = '<option value="">Vyberte okres</option>';
            selObec.innerHTML = '<option value="">Vyberte obec</option>';
            selOkres.disabled = true;
            selObec.disabled = true;
            vysledkyObceDiv.innerHTML = '';
            if (kraj && lokalityData[kraj]) {
                selOkres.disabled = false;
                Object.keys(lokalityData[kraj]).sort().forEach(okres => {
                    let opt = document.createElement('option');
                    opt.value = okres;
                    opt.textContent = okres;
                    selOkres.appendChild(opt);
                });
            }
        });

        // 3. Obsluha výběru okresu
        selOkres.addEventListener('change', function() {
            const kraj = selKraj.value;
            const okres = this.value;
            selObec.innerHTML = '<option value="">Vyberte obec</option>';
            selObec.disabled = true;
            vysledkyObceDiv.innerHTML = '';
            if (kraj && okres && lokalityData[kraj][okres]) {
                selObec.disabled = false;
                lokalityData[kraj][okres].forEach(obec => {
                    let opt = document.createElement('option');
                    opt.value = obec.id;
                    opt.textContent = obec.nazev;
                    selObec.appendChild(opt);
                });
            }
        });

        // 4. Obsluha výběru obce a načtení dat
        selObec.addEventListener('change', function() {
            const kodObce = this.value;
            vysledkyObceDiv.innerHTML = '';
            if (kodObce) {
                loadingObceDiv.style.display = 'block';
                fetch(`https://raw.githubusercontent.com/bi-cnc/kandidatky-2026/main/data_obci/${kodObce}.json`)
                    .then(res => {
                        if (!res.ok) throw new Error("Data pro tuto obec se nepodařilo načíst.");
                        return res.json();
                    })
                    .then(data => vykresliVysledkyObce(data))
                    .catch(err => {
                        vysledkyObceDiv.innerHTML = `<p style="color:red">${err.message}</p>`;
                    })
                    .finally(() => {
                        loadingObceDiv.style.display = 'none';
                    });
            }
        });

        // Vykreslení výsledků pro danou obec
        function vykresliVysledkyObce(data) {
            let html = '';
            if (data.strany.length === 0) {
                vysledkyObceDiv.innerHTML = '<p>Pro tuto obec nejsou evidovány žádné kandidátní listiny.</p>';
                return;
            }
            data.strany.forEach(strana => {
                let kandidatiHtml = '';
                strana.kandidati.forEach(k => {
                    kandidatiHtml += `
                        <div class="candidate-item">
                            <div class="candidate-name">${k.poradi}. ${k.jmeno}</div>
                            <div class="candidate-details">
                                ${k.vek} let, ${k.povolani}, ${k.bydliste}, politická příslušnost: <b>${k.pol_prisl}</b>, navrhující subjekt: <b>${k.navrh_subj}</b>
                            </div>
                        </div>
                    `;
                });
                html += `
                    <div class="party-accordion">
                        <div class="party-header" onclick="this.parentElement.classList.toggle('active')">
                            <div>
                                <div class="party-title">${strana.zkratka}</div>
                                <div class="party-subtitle">${strana.nazev}</div>
                            </div>
                            <div class="chevron"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></div>
                        </div>
                        <div class="party-content">
                            ${kandidatiHtml || '<p style="padding: 15px 0;">Nejsou evidováni žádní kandidáti.</p>'}
                        </div>
                    </div>
                `;
            });
            vysledkyObceDiv.innerHTML = html;
        }

        // --- ZÁLOŽKA: VYHLEDÁVÁNÍ KANDIDÁTŮ ---
        function loadSearchIndex() {
            loadingSearchDiv.style.display = 'block';
            fetch('https://raw.githubusercontent.com/bi-cnc/kandidatky-2026/main/search_index.json')
                .then(res => res.json())
                .then(data => {
                    searchIndex = data;
                    searchIndexLoaded = true;
                    searchInput.disabled = false;
                    vysledkySearchDiv.innerHTML = 'Index načten. Začněte psát (alespoň 3 znaky).';
                })
                .catch(err => {
                    vysledkySearchDiv.innerHTML = `<p style="color:red">Chyba při načítání databáze kandidátů.</p>`;
                })
                .finally(() => {
                    loadingSearchDiv.style.display = 'none';
                });
        }

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            if (query.length < 3) {
                vysledkySearchDiv.innerHTML = 'Zadejte alespoň 3 znaky pro vyhledávání.';
                return;
            }

            // Filtrace v poli searchIndex
            const results = searchIndex.filter(k => k.j_low.includes(query)).slice(0, 50);

            if (results.length === 0) {
                vysledkySearchDiv.innerHTML = 'Nenalezen žádný kandidát odpovídající zadání.';
                return;
            }

            let html = '';
            results.forEach(k => {
                let pol_prisl_text = k.pp !== k.s ? `, navrhující subjekt: <b>${k.ns}</b>` : '';
                
                html += `
                    <div class="search-result-item">
                        <div class="search-result-header">
                            <span class="candidate-name">${k.p}. ${k.j}</span>
                            <span class="search-result-party-badge">${k.s}</span>
                        </div>
                        <div class="candidate-details">
                            ${k.v} let, ${k.pov}, ${k.b}, politická příslušnost: <b>${k.pp}</b>${pol_prisl_text}
                        </div>
                        <div class="search-result-location">
                            ${k.o}, okr. ${k.ok}
                        </div>
                    </div>
                `;
            });
            vysledkySearchDiv.innerHTML = html;
        });
    })();
</script>
